name: Ara

on:
  workflow_dispatch:
  push:
    branches: [main, Claude, "GPT/Codex", ara-hardened, "copilot/main", Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, "GPT/Codex", ara-hardened, "copilot/main", Collaboration, duckAI, devassist420]

permissions:
  contents: read

jobs:
  ara:
    name: Ara validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          if ! git config --get http.extraheader >/dev/null; then
            echo "http.extraheader missing after fetch; refusing to continue"
            exit 1
          fi
          git config --unset-all http.extraheader
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
      - name: Validate first-party Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          # Known non-modules misnamed as .py (docs dumps / PEM text):
          # - Avatar_Companion_service.py  (markdown + concat modules)
          # - GitHub_TLS_pem.py            (certificate text, not code)
          while IFS= read -r -d '' file; do
            case "$file" in
              Avatar_Companion_service.py|GitHub_TLS_pem.py)
                echo "SKIP (non-module dump): $file"
                continue
                ;;
            esac
            python3 -m py_compile "$file"
          done < <(git -c core.quotePath=false ls-files -z -- '*.py' ':!:external/**' ':!:.venv/**')
          echo 'Ara Python syntax validation: PASS'
