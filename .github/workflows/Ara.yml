name: Ara

on:
  workflow_dispatch:
  push:
    branches: [main, Claude, "GPT/Codex", ara-hardened, "copilot/main", Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, "GPT/Codex", ara-hardened, "copilot/main", Collaboration, duckAI, devassist420]

permissions:
  contents: read

jobs:
  ara:
    name: Ara validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
      - name: Validate first-party Python syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          # Avatar_Companion_service.py is a docs+concat dump (leading markdown,
          # multiple from __future__) — not a single valid module. Exclude until split.
          # All other tracked *.py must compile.
          while IFS= read -r -d '' file; do
            case "$file" in
              Avatar_Companion_service.py) echo "SKIP (docs/concat dump): $file"; continue ;;
            esac
            python3 -m py_compile "$file"
          done < <(git -c core.quotePath=false ls-files -z -- '*.py' ':!:external/**' ':!:.venv/**')
          echo 'Ara Python syntax validation: PASS'
