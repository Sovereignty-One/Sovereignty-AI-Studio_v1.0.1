name: Python CI

on:
  workflow_dispatch:
  push:
    branches: [ "main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420" ]
  pull_request:
    branches: [ "main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420" ]

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Python CI (GitHub-hosted Ubuntu / ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision (full SHA pinned action)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact commit and runner labels
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d .git
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -n "${GITHUB_SHA}"
          echo "CHECKOUT_OK=true"
          echo "COMMIT=${GITHUB_SHA}"
          echo "COMMIT_SHA_LENGTH=${#GITHUB_SHA}"
          echo "RUNNER_LABEL_CLASS=github-hosted/ubuntu-latest"
          echo "RUNNER=${RUNNER_OS}/${RUNNER_ARCH}"

      - name: PQC signed SCAR gate (ML-DSA-87 + BLAKE3)
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check blake3 liboqs-python
          test -f scripts/scar_pqc_attest.py
          mkdir -p "$RUNNER_TEMP/scar/pqc"
          SCAR_PQC_KEY_DIR="$RUNNER_TEMP/scar/pqc" \
          SCAR_PQC_OUTPUT="$RUNNER_TEMP/scar/attestation.json" \
          python3 scripts/scar_pqc_attest.py --status PASS --commit "$GITHUB_SHA"
          test -s "$RUNNER_TEMP/scar/attestation.json"

      - name: Set up isolated Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          targets=()
          for directory in backend/coordination prototypes/accessibility; do
            [[ -e "${directory}" ]] && targets+=("${directory}")
          done
          if (( ${#targets[@]} )); then ruff check "${targets[@]}"; else ruff check .; fi
      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        shell: bash
        run: |
          python -m pytest -q
      - name: Coordination import check
        shell: bash
        run: |
          python -c "from backend.coordination import branch_registry; print('Coordination import: ok')"
