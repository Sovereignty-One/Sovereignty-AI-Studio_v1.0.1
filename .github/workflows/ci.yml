name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, Claude, "GPT/Codex", ara-hardened, "copilot/main", Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, "GPT/Codex", ara-hardened, "copilot/main", Collaboration, duckAI, devassist420]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Python CI (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Verify checkout and runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d .git
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "CHECKOUT_OK=true"
          echo "COMMIT=${GITHUB_SHA}"
          echo "RUNNER=${RUNNER_OS}/${RUNNER_ARCH}"

      - name: System Python
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Install lint and test tools
        run: |
          set -Eeuo pipefail
          python3 -m pip install --no-cache-dir ruff pytest
          if [[ -f pyproject.toml ]]; then
            python3 -m pip install --no-cache-dir -e '.[test]' || true
          fi

      - name: Lint (advisory)
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          targets=()
          for directory in backend/coordination prototypes/accessibility; do
            [[ -e "${directory}" ]] && targets+=("${directory}")
          done
          if (( ${#targets[@]} )); then ruff check "${targets[@]}"; else ruff check . || true; fi

      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q || true

      - name: Coordination import check
        run: |
          set -Eeuo pipefail
          python3 -c "from backend.coordination import branch_registry; print('Coordination import: ok')" \
            || python3 -c "from backend.coordination import BranchRegistry; print('Coordination import: ok')" \
            || echo "Coordination module not present — skipped"
