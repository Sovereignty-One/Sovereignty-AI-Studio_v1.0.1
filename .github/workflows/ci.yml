name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, Claude, "GPT/Codex", ara-hardened, "copilot/main", Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, "GPT/Codex", ara-hardened, "copilot/main", Collaboration, duckAI, devassist420]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Python CI (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Verify checkout and runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d .git
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "CHECKOUT_OK=true"
          echo "COMMIT=${GITHUB_SHA}"
          echo "RUNNER=${RUNNER_OS}/${RUNNER_ARCH}"

      - name: System Python
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Install test dependencies
        run: |
          set -Eeuo pipefail
          if [[ -f pyproject.toml ]]; then
            python3 -m pip install --no-cache-dir -e ".[test]" \
              || python3 -m pip install --no-cache-dir pytest==9.1.1 pytest-asyncio==1.4.0
          else
            python3 -m pip install --no-cache-dir pytest==9.1.1 pytest-asyncio==1.4.0
          fi
          python3 -m pytest --version

      - name: Run real tests (hard fail)
        env:
          PYTHONPATH: ".:prototypes:backend"
        run: |
          set -Eeuo pipefail
          if [[ ! -d tests ]]; then
            echo "ERROR: tests/ directory missing — refusing soft-pass"
            exit 1
          fi
          python3 -m pytest tests/ -q --tb=short

      - name: Coordination import check (hard when present)
        run: |
          set -Eeuo pipefail
          if [[ -d backend/coordination ]]; then
            python3 -c "from backend.coordination import branch_registry; print('Coordination import: ok')" \
              || python3 -c "from backend.coordination import BranchRegistry; print('Coordination import: ok')"
          else
            echo "backend/coordination not present on this tree — skipped"
          fi
