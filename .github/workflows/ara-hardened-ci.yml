name: ara-hardened-unit-ci-local

# Explicit compatibility lane. The authoritative repository gate is
# .github/workflows/ci.yml. This workflow is intentionally visible on pushes
# and pull requests so failures are reported as normal checks.
on:
  workflow_dispatch:
  push:
    branches: [ "Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420" ]
  pull_request:
    branches: [ "Collaboration, main, Claude, GPT/Codex, ara-hardened, copilot/main, duckAI, devassist420" ]

concurrency:
  group: ara-hardened-unit-ci-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI_NAME: ara-hardened-unit-ci-local

jobs:
  light:
    name: Visible local coordination and accessibility checks
    runs-on: ['self-hosted, macos, arm64']
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Startup verification
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_ACTIONS}" = "true"
          test -n "${GITHUB_SHA}"
          echo "Running visible CI for ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

      - name: Set up isolated Python
        shell: bash
        run: |
          set -Eeuo pipefail
          python_bin="$(command -v python3.13 || command -v python3)"
          "${python_bin}" -m venv .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
          python --version

      - name: Install minimal test tools
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip pytest

      - name: Coordination import check
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0, '.')
          from backend.coordination import BranchRegistry

          registry = BranchRegistry()
          assert not registry.is_writable('main')
          assert not registry.is_writable('collaboration')
          assert registry.is_writable('ara-hardened')
          print('coordination OK')
          PY

      - name: Accessibility harness tests
        env:
          PYTHONPATH: prototypes
        run: pytest -q prototypes/accessibility/tests/test_accessibility_control.py
