name: Release Gate

on:
  pull_request:
    branches: [Collaboration]
  push:
    branches: [Collaboration, codex/release-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository without external actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Startup
        run: |
          set -Eeuo pipefail
          echo "event=${GITHUB_EVENT_NAME}"
          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"
          echo "python=$(python3 --version)"
          echo "node=$(node --version)"
          echo "npm=$(npm --version)"
          echo "STARTUP=PASS"

      - name: Install root Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install bridge Node dependencies
        run: npm --prefix node-bridge install --ignore-scripts --no-audit --no-fund

      - name: Install Python runtime dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-runtime.txt

      - name: Run release gate
        run: bash scripts/release-verify.sh
