name: Release Readiness

on:
  pull_request:
    branches: [Collaboration]
  push:
    branches: [Collaboration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node-bridge/package-lock.json

      - name: Install root Node dependencies
        run: npm ci --ignore-scripts

      - name: Install bridge Node dependencies
        run: npm --prefix node-bridge ci --ignore-scripts

      - name: Install Python runtime dependencies
        run: python -m pip install -r requirements-runtime.txt

      - name: Run release gate
        run: bash scripts/release-verify.sh
