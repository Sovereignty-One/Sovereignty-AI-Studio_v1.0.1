name: CI Startup Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-probe:
    name: CI startup probe
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Report workflow state
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKFLOW_VISIBLE=true"
          echo "WORKFLOW_FILE=.github/workflows/startup-probe.yml"
          echo "RUNNER=${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}"
          uname -m
          python3 --version
