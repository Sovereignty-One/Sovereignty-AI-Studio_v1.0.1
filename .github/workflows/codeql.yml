name: CodeQL Advanced

# github/codeql-action/* is third-party and blocked by org action policy.
# Until CodeQL is approved under Sovereignty-One ownership, this workflow
# runs a visible first-party readiness job so the check is never silent.

on:
  push:
    branches: [Collaboration, main]
  pull_request:
    branches: [Collaboration, main]
  schedule:
    - cron: '34 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-policy-gate:
    name: CodeQL policy gate (visible)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Inventory languages and report CodeQL block
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== CodeQL Advanced — visible policy gate ==="
          echo "Blocked actions: actions/checkout, github/codeql-action/init, github/codeql-action/analyze"
          echo "Org policy: only Sovereignty-One owned actions are allowed"
          echo ""
          echo "Language inventory (tracked files):"
          git -c core.quotePath=false ls-files | sed -n 's/.*\.\([a-zA-Z0-9]\+\)$/\1/p' | sort | uniq -c | sort -rn | head -30
          echo ""
          echo "RESULT: CodeQL commercial action path is disabled by policy"
          echo "        Approve github/codeql-action under org policy, or replace with first-party scanner"
          exit 1
