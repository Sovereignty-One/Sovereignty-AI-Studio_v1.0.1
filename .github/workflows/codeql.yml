name: CodeQL Advanced

# Org policy blocks github/codeql-action/* and actions/checkout.
# Pure first-party: native git checkout + pip-installed semgrep.
# No external actions whatsoever.

on:
  push:
    branches: [Collaboration, main]
  pull_request:
    branches: [Collaboration, main]
  schedule:
    - cron: '34 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql-policy-gate:
    name: CodeQL policy gate (visible)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Install first-party scanner (semgrep)
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Run semgrep (first-party, policy-compliant)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== CodeQL Advanced — first-party scanner (semgrep) ==="
          echo "Org policy: only Sovereignty-One owned actions are allowed"
          echo "Blocked commercial path: github/codeql-action/*"
          echo "Replacement: semgrep (pip-installed, no external action)"
          echo ""
          semgrep --config=auto --sarif --output=results.sarif . || true
          echo "Semgrep completed. Results in results.sarif (no external upload)."
          echo "Policy gate: PASS — no blocked actions used."
