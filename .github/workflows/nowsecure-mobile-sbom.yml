name: NowSecure Mobile SBOM

# Commercial NowSecure SBOM requires:
#   - org-approved nowsecure/* actions (currently blocked by policy)
#   - secrets.NS_TOKEN
#   - a built .ipa / .apk artifact
#   - a real Platform group_id (not the template placeholder)
# Until those exist, this workflow is manual-only and reports the gap.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom-readiness:
    name: Mobile SBOM readiness (first-party)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Report SBOM prerequisites (hard facts, no fake pass)
        env:
          NS_TOKEN: ${{ secrets.NS_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== Mobile SBOM readiness ==="
          missing=0

          if [[ -z "${NS_TOKEN:-}" ]]; then
            echo "FAIL: secrets.NS_TOKEN is not set"
            missing=1
          else
            echo "OK: secrets.NS_TOKEN is present"
          fi

          if [[ -f gradlew ]] || [[ -d android ]] || [[ -d app ]]; then
            echo "OK: Android/gradle tree detected"
          else
            echo "FAIL: no Android/gradle project (no gradlew / android / app)"
            missing=1
          fi

          if find . -name '*.ipa' -o -name '*.apk' 2>/dev/null | grep -q .; then
            echo "OK: built mobile artifact present"
            find . -name '*.ipa' -o -name '*.apk' 2>/dev/null | head -20
          else
            echo "FAIL: no .ipa/.apk artifact in tree"
            missing=1
          fi

          echo "POLICY: nowsecure/* actions are third-party and blocked by org action policy"
          echo "        until approved under Sovereignty-One ownership, commercial upload is disabled"

          if [[ "$missing" -ne 0 ]]; then
            echo "RESULT: Mobile SBOM is not runnable — prerequisites missing"
            exit 1
          fi
          echo "RESULT: prerequisites met; commercial NowSecure step still requires policy-approved action"
          exit 1
