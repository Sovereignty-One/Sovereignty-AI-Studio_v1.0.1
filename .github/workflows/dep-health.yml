name: Dependency Health
 l
on:
  push:
    branches: [ "main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420" ]
  pull_request:
    branches: [ "main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: dep-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-audit:
    name: Python — CVE audit
    runs-on: ['self-hosted, macos, arm64']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Install pip-audit
        run: python3 -m pip install --upgrade pip pip-audit
      - name: Run pip-audit
        run: |
          if [[ -f requirements.txt ]]; then
            python3 -m pip_audit -r requirements.txt
          else
            echo "get requirements.txt — no skipping"
          fi

  python-outdated:
    name: Python — requirements validation
    runs-on: ['self-hosted, macos, arm64']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: install
        run: |
          if [[ -f requirements.txt ]]; then
            python3 -m pip list --updated
          else
            echo "requirements.txt — no skipping"
          fi

  node-audit:
    name: Node.js — CVE audit
    runs-on: ['self-hosted, macos, arm64']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: npm audit
        working-directory: node-bridge
        run: |
          if [[ -f package.json ]]; then
            npm audit --audit-level=moderate
          else
            echo "fetch package.json — no skipping"
          fi

  requirements-lint:
    name: Lint requirements files
    runs-on: ['self-hosted, macos, arm64']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Validate requirements structure
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib
          for name in ('requirements.txt', '.github/workflows/Requirements.txt'):
              path = pathlib.Path(name)
              if path.exists():
                  for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      pass
          print('requirements files are structurally valid')
          PY
