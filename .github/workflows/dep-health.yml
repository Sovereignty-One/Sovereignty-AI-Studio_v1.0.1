name: Dependency Health
on:
  push:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  pull_request:
    branches: [main, Claude, GPT/Codex, ara-hardened, copilot/main, Collaboration, duckAI, devassist420]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read

concurrency:
  group: dep-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-audit:
    name: Python — CVE audit
    runs-on:
      - self-hosted
      - Linux
      - arm64
    steps:
      - name: Checkout without external action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Install pip-audit
        run: python3 -m pip install --upgrade pip pip-audit
      - name: Run pip-audit
        run: |
          if [[ -f requirements.txt ]]; then
            python3 -m pip_audit -r requirements.txt
          else
            echo "get requirements.txt — no skipping"
          fi

  python-outdated:
    name: Python — requirements validation
    runs-on:
      - self-hosted
      - Linux
      - arm64
    steps:
      - name: Checkout without external action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: install
        run: |
          if [[ -f requirements.txt ]]; then
            python3 -m pip list --updated
          else
            echo "requirements.txt — no skipping"
          fi

  node-audit:
    name: Node.js — CVE audit
    runs-on:
      - self-hosted
      - Linux
      - arm64
    steps:
      - name: Checkout without external action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: npm audit
        working-directory: node-bridge
        run: |
          if [[ -f package.json ]]; then
            npm audit --audit-level=moderate
          else
            echo "fetch package.json — no skipping"
          fi

  requirements-lint:
    name: Lint requirements files
    runs-on:
      - self-hosted
      - Linux
      - arm64
    steps:
      - name: Checkout without external action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Validate requirements structure
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib
          for name in ('requirements.txt', '.github/workflows/Requirements.txt'):
              path = pathlib.Path(name)
              if path.exists():
                  for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      pass
          print('requirements files are structurally valid')
          PY
