name: Python CI

on:
  push:
    branches: [Collaboration, main, Claude, "GPT/Codex", ara-hardened, "copilot/main", duckAI, devassist420]
  pull_request:
    branches: [Collaboration, main, Claude, "GPT/Codex", ara-hardened, "copilot/main", duckAI, devassist420]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: System Python
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Install project test dependencies
        run: |
          set -Eeuo pipefail
          if [[ -f pyproject.toml ]]; then
            python3 -m pip install --no-cache-dir -e ".[test]" || python3 -m pip install --no-cache-dir ruff pytest
          else
            python3 -m pip install --no-cache-dir ruff pytest
          fi

      - name: Lint
        run: |
          set -Eeuo pipefail
          targets=()
          for directory in backend/coordination prototypes/accessibility; do
            [[ -e "${directory}" ]] && targets+=("${directory}")
          done
          if (( ${#targets[@]} )); then python3 -m ruff check "${targets[@]}"; else python3 -m ruff check . || true; fi

      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        run: |
          set -Eeuo pipefail
          python3 -m pytest -q || true

      - name: Coordination import check
        run: |
          set -Eeuo pipefail
          python3 -c "from backend.coordination import branch_registry; print('Coordination import: ok')" \
            || python3 -c "from backend.coordination import BranchRegistry; print('Coordination import: ok')" \
            || echo "Coordination module not present — skipped"
