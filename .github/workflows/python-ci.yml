name: Python CI

on:
  push:
    branches: [Collaboration, main, Claude, "GPT/Codex", ara-hardened, "copilot/main", duckAI, devassist420]
  pull_request:
    branches: [Collaboration, main, Claude, "GPT/Codex", ara-hardened, "copilot/main", duckAI, devassist420]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    runs-on: macos-latest
    steps:
      - name: Checkout repository (native git; no external action)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote remove origin
      - name: Select runner-provided Python
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v python3.11 >/dev/null 2>&1; then
            PYTHON_BIN="$(command -v python3.11)"
          elif command -v python3 >/dev/null 2>&1; then
            PYTHON_BIN="$(command -v python3)"
          else
            echo "No supported Python interpreter is installed on the runner." >&2
            exit 1
          fi
          echo "PYTHON_BIN=${PYTHON_BIN}" >> "${GITHUB_ENV}"
          "${PYTHON_BIN}" --version
      - name: Set up isolated Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          ${PYTHON_BIN} -m venv .venv
          . .venv/bin/activate
          ${PYTHON_BIN} -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
      - name: Install project test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f pyproject.toml ]]; then
            ${PYTHON_BIN} -m pip install --no-cache-dir -e ".[test]" || ${PYTHON_BIN} -m pip install --no-cache-dir ruff pytest
          else
            ${PYTHON_BIN} -m pip install --no-cache-dir ruff pytest
          fi
      - name: Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          targets=()
          for directory in backend/coordination prototypes/accessibility; do
            [[ -e "${directory}" ]] && targets+=("${directory}")
          done
          if (( ${#targets[@]} )); then ruff check "${targets[@]}"; else ruff check .; fi
      - name: Run tests
        env:
          PYTHONPATH: prototypes:.
        shell: bash
        run: ${PYTHON_BIN} -m pytest -q
      - name: Coordination import check
        shell: bash
        run: |
          ${PYTHON_BIN} -c "from backend.coordination import branch_registry; print('Coordination import: ok')" || echo 'Coordination import skipped (module absent)'
