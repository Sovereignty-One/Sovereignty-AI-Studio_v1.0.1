name: Lint Autofix Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-autofix:
    name: Lint autofix
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Report workflow state
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKFLOW_VISIBLE=true"
          echo "WORKFLOW_FILE=.github/workflows/lint-autofix-recovery.yml"
          echo "RUNNER=${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}"
          uname -m
