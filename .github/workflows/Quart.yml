name: Quart App CI

on:
  push:
    branches: [Collaboration, main, Claude, "GPT/Codex", ara-hardened, "copilot/main", duckAI, devassist420]
  pull_request:
    branches: [Collaboration, main, Claude, "GPT/Codex", ara-hardened, "copilot/main", duckAI, devassist420]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quart-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quart-tests:
    name: Quart tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (native git; no external action)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git remote remove origin
      - name: Select runner-provided Python
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v python3.11 >/dev/null 2>&1; then
            PYTHON_BIN="$(command -v python3.11)"
          elif command -v python3 >/dev/null 2>&1; then
            PYTHON_BIN="$(command -v python3)"
          else
            echo "No supported Python interpreter is installed on the runner." >&2
            exit 1
          fi
          echo "PYTHON_BIN=${PYTHON_BIN}" >> "${GITHUB_ENV}"
          "${PYTHON_BIN}" --version
      - name: Set up isolated Python environment
        shell: bash
        run: |
          set -Eeuo pipefail
          ${PYTHON_BIN} -m venv .ci-venv
          . .ci-venv/bin/activate
          ${PYTHON_BIN} -m pip install --upgrade pip setuptools wheel
          echo "${GITHUB_WORKSPACE}/.ci-venv/bin" >> "${GITHUB_PATH}"
      - name: Install required packages
        shell: bash
        run: |
          set -Eeuo pipefail
          ${PYTHON_BIN} -m pip install --no-cache-dir quart fastapi nacl pydantic pytest-asyncio
      - name: Verify required imports
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import fastapi
          import nacl
          import pydantic
          import quart
          import pytest_asyncio
          print('Quart imports: ok')
          PY
