name: NowSecure

# Same constraints as Mobile SBOM: third-party action blocked, NS_TOKEN,
# built app artifact, and Platform group_id required. Manual only until ready.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nowsecure-readiness:
    name: NowSecure readiness (first-party)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Report NowSecure prerequisites
        env:
          NS_TOKEN: ${{ secrets.NS_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== NowSecure readiness ==="
          missing=0

          if [[ -z "${NS_TOKEN:-}" ]]; then
            echo "FAIL: secrets.NS_TOKEN is not set"
            missing=1
          else
            echo "OK: secrets.NS_TOKEN is present"
          fi

          if find . -name '*.ipa' -o -name '*.apk' 2>/dev/null | grep -q .; then
            echo "OK: mobile artifact present"
          else
            echo "FAIL: no .ipa/.apk to upload"
            missing=1
          fi

          echo "POLICY: nowsecure/nowsecure-action and github/codeql-action/upload-sarif are blocked"

          if [[ "$missing" -ne 0 ]]; then
            echo "RESULT: NowSecure scan is not runnable"
            exit 1
          fi
          echo "RESULT: prerequisites met but action policy still blocks commercial upload"
          exit 1
