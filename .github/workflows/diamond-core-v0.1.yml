name: Diamond Lattice 5D Core v0.1 

on:
  push:
    paths:
      - 'diamond-core/**'
      - '.github/workflows/diamond-core-v0.1.yml'
  pull_request:
    branches: [Collaboration]
    paths:
      - 'diamond-core/**'
      - '.github/workflows/diamond-core-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diamond-core-v0.1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Diamond Core v0.1 Contract Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "${RUNNER_OS}" = "Linux"
          echo "Diamond Core runner OK"
