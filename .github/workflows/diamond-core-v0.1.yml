name: Diamond Lattice 5D Core v0.1

on:
  push:
    paths:
      - 'diamond-core/**'
      - '.github/workflows/diamond-core-v0.1.yml'
  pull_request:
    branches: [Collaboration]
    paths:
      - 'diamond-core/**'
      - '.github/workflows/diamond-core-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diamond-core-v0.1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Diamond Core v0.1 Contract Gate
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is 
