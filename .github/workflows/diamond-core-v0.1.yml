name: Diamond Lattice 5D Core v0.1

on:
  push:
    paths:
      - 'diamond-core/**'
      - '.github/workflows/diamond-core-v0.1.yml'
  pull_request:
    branches: [Collaboration]
    paths:
      - 'diamond-core/**'
      - '.github/workflows/diamond-core-v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diamond-core-v0.1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Diamond Core v0.1 Contract Gate
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          : "${GH_TOKEN:?GITHUB_TOKEN is required}"
          rm -rf .git
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          if ! git config --get http.extraheader; then
            echo "http.extraheader missing after fetch; refusing to continue"
            exit 1
          fi
          git config --unset-all http.extraheader

      - name: Runner contract
        run: |
          set -Eeuo pipefail
          test -n "${GITHUB_ACTIONS:-}"
          test "${RUNNER_OS:-}" = "Linux"
          case "${RUNNER_ARCH:-}" in
            X64|ARM64) ;;
            *) echo "Unsupported runner architecture: ${RUNNER_ARCH:-unknown}"; exit 1 ;;
          esac
          printf 'runner=%s/%s kernel=%s commit=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$(uname -m)" "$GITHUB_SHA"

      - name: Rust toolchain
        run: |
          set -Eeuo pipefail
          command -v cargo
          command -v rustc
          cargo --version
          rustc --version

      - name: Diamond Core tests
        run: |
          set -Eeuo pipefail
          test -f diamond-core/Cargo.toml
          cargo test --manifest-path diamond-core/Cargo.toml --all-targets

      - name: Contract certification
        run: |
          set -Eeuo pipefail
          echo 'DIAMOND_LATTICE_V0_1=PASS'
          echo "Validated commit: ${GITHUB_SHA}"
