name: rust-clippy analyze

on:
  push:
    branches: [Collaboration, main]
  pull_request:
    branches: [Collaboration, main]
  schedule:
    - cron: '20 4 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-clippy:
    name: rust-clippy (first-party)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit (native git, no external action)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git config --unset-all http.extraheader 2>/dev/null || true

      - name: Locate Cargo projects
        id: cargo
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t manifests < <(git -c core.quotePath=false ls-files '**/Cargo.toml' 'Cargo.toml' || true)
          if (( ${#manifests[@]} == 0 )); then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml in tree"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${manifests[@]}"
            echo "manifests<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${manifests[@]}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain (system apt/rustup if available)
        if: steps.cargo.outputs.found == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v rustc >/dev/null 2>&1; then
            rustc --version
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal -c clippy
            # shellcheck disable=SC1091
            source "$HOME/.cargo/env"
            rustc --version
            cargo --version
          fi
          rustup component add clippy || true

      - name: Run cargo clippy (hard fail)
        if: steps.cargo.outputs.found == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          # shellcheck disable=SC1091
          [[ -f "$HOME/.cargo/env" ]] && source "$HOME/.cargo/env"
          failed=0
          while IFS= read -r manifest; do
            [[ -z "$manifest" ]] && continue
            dir=$(dirname "$manifest")
            echo "=== clippy in $dir ==="
            (cd "$dir" && cargo clippy --all-targets -- -D warnings) || failed=1
          done <<< "${{ steps.cargo.outputs.manifests }}"
          exit "$failed"

      - name: No Rust project
        if: steps.cargo.outputs.found != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "RESULT: no Cargo.toml — rust-clippy has nothing to analyze"
          echo "Previously this workflow used blocked actions and failed silently"
          exit 1
